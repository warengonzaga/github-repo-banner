name: Build Flow

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: wgtechlabs/build-flow-action/.github/workflows/ci.yml@b46ac3e40de838b87e1da6b3e69382982d080916 # v0.2.1
    with:
      # Use the Node profile so Bun can be pinned instead of installed as latest.
      ci-profile: node
      ci-runtime-version: '22'
      ci-setup-command: |
        npm install --global bun@1.3.9
        echo "$(npm prefix --global)/bin" >> "$GITHUB_PATH"
      ci-install-command: bun install --frozen-lockfile
      ci-lint-command: bun run check
      ci-build-command: bun run build
      # Declaration generation typechecks; integration checks run below.
      ci-typecheck-command: ':'
      ci-test-command: ':'
      ci-coverage-command: ':'
      enable-gitleaks: false # Preserve the existing gate set.

  integration:
    name: Redis and Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build
        run: |
          npm install --global bun@1.3.9
          bun install --frozen-lockfile
          bun run build
      - name: Regression checks
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379
        run: |
          for check in scripts/check-*.ts; do bun "$check"; done
          for check in scripts/check-*.mjs; do node "$check"; done
      - name: Docker build and runtime smoke check
        run: sh scripts/check-docker.sh

  build:
    name: Build
    if: always()
    needs: [ci, integration]
    runs-on: ubuntu-latest
    steps:
      # Keep the existing Build check name available for branch protection.
      - name: Require successful validation
        env:
          CI_RESULT: ${{ needs.ci.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: test "$CI_RESULT" = success && test "$INTEGRATION_RESULT" = success

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: github-repo-banner-release
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Railway deploys from GitHub; releases do not require registry publishing.
      - name: Create Release
        uses: wgtechlabs/release-build-flow-action@6df9cb42c24c296d902150d051a0b6be4422cccc # v1.8.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
