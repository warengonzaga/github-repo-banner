name: Build Flow

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

# Keep release creation and its image publishing in order on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: CI
    uses: wgtechlabs/build-flow-action/.github/workflows/ci.yml@b46ac3e40de838b87e1da6b3e69382982d080916 # v0.2.1
    with:
      # Use the Node profile so Bun can be pinned instead of installed as latest.
      ci-profile: node
      ci-runtime-version: '22'
      ci-setup-command: |
        npm install --global bun@1.3.9
        echo "$(npm prefix --global)/bin" >> "$GITHUB_PATH"
      ci-install-command: bun install --frozen-lockfile
      ci-lint-command: bun run check
      ci-build-command: bun run build
      # Declaration generation typechecks; integration checks run below.
      ci-typecheck-command: ':'
      ci-test-command: ':'
      ci-coverage-command: ':'
      enable-gitleaks: false # Preserve the existing gate set.

  integration:
    name: Redis and Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build
        run: |
          npm install --global bun@1.3.9
          bun install --frozen-lockfile
          bun run build
      - name: Regression checks
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379
        run: |
          for check in scripts/check-*.ts; do bun "$check"; done
          for check in scripts/check-*.mjs; do node "$check"; done
      - name: Docker build and runtime smoke check
        run: sh scripts/check-docker.sh

  build:
    name: Build
    if: always()
    needs: [ci, integration]
    runs-on: ubuntu-latest
    steps:
      # Keep the existing Build check name available for branch protection.
      - name: Require successful validation
        env:
          CI_RESULT: ${{ needs.ci.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: test "$CI_RESULT" = success && test "$INTEGRATION_RESULT" = success

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.release-created }}
      version-tag: ${{ steps.release.outputs.version-tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create Release
        id: release
        uses: wgtechlabs/release-build-flow-action@6df9cb42c24c296d902150d051a0b6be4422cccc # v1.8.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Publish Container
    needs: release
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Reject superseded release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.version-tag }}
        run: |
          latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ -z "$RELEASE_TAG" ] || [ "$latest_tag" != "$RELEASE_TAG" ]; then
            echo "::error::This release is no longer current. Refusing to overwrite floating image tags."
            exit 1
          fi

      - name: Checkout released source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version-tag }}

      - name: Record released revision
        id: source
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Publish release images
        id: container
        uses: wgtechlabs/container-build-flow-action@fb5c0662b33f7702bc1ccf85350689436989f606 # v1.9.0
        with:
          registry: both
          dockerhub-username: ${{ secrets.DOCKER_HUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          planned-version-tag: ${{ needs.release.outputs.version-tag }}
          bot-detection: false
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}

      - name: Require both registries
        env:
          DOCKERHUB_PUBLISHED: ${{ steps.container.outputs.dockerhub-published }}
          GHCR_PUBLISHED: ${{ steps.container.outputs.ghcr-published }}
        run: test "$DOCKERHUB_PUBLISHED" = true && test "$GHCR_PUBLISHED" = true
