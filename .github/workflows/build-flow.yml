name: Build Flow

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# Keep main pushes ordered through native artifact and release publication.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-flow:
    name: Build Flow
    uses: wgtechlabs/build-flow-action/.github/workflows/app.yml@f8263c388160a62f4a0e72ed888e56c8e9159469 # v1.0.0
    permissions:
      contents: write
      packages: write
      pull-requests: write
      security-events: write
      actions: read
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    with:
      enable-container: true
      # Fork PRs cannot receive registry credentials; keep their validation enabled.
      publish-pr-artifacts: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      # Use native development publishing, tagging, and release ordering.
      # The Bun lockfile selects the default node-bun profile/package manager.
      codeql-build-mode: none
      ci-runtime-version: '22'
      # setup-bun reads packageManager: bun@1.3.9 from package.json.
      ci-setup-command: test "$(bun --version)" = '1.3.9'
      ci-install-command: bun install --frozen-lockfile
      ci-lint-command: bun run check
      ci-build-command: bun run build
      # Check every source module, including browser modules.
      ci-typecheck-command: 'bunx tsc --noEmit'
      ci-test-command: ':'
      ci-coverage-command: ':'
      enable-gitleaks: false # Preserve the existing Gitleaks setting.

  build:
    name: Build
    if: always()
    needs: build-flow
    runs-on: ubuntu-latest
    steps:
      # Keep the existing Build check name available for branch protection.
      - name: Require successful validation
        env:
          BUILD_FLOW_RESULT: ${{ needs.build-flow.result }}
        run: test "$BUILD_FLOW_RESULT" = success
