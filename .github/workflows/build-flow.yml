name: Build Flow

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# Keep main pushes ordered through native artifact and release publication.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-flow:
    name: Build Flow
    needs: integration
    uses: wgtechlabs/build-flow-action/.github/workflows/app.yml@f8263c388160a62f4a0e72ed888e56c8e9159469 # v1.0.0
    permissions:
      contents: write
      packages: write
      pull-requests: write
      security-events: write
      actions: read
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    with:
      enable-container: true
      # Fork PRs cannot receive registry credentials; keep their validation enabled.
      publish-pr-artifacts: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      # Use native development publishing, tagging, and release ordering.
      # The Bun lockfile selects the default node-bun profile/package manager.
      codeql-build-mode: none
      ci-runtime-version: '22'
      # setup-bun reads packageManager: bun@1.3.9 from package.json.
      ci-setup-command: test "$(bun --version)" = '1.3.9'
      ci-install-command: bun install --frozen-lockfile
      ci-lint-command: bun run check
      ci-build-command: bun run build
      # Check every source module, including browser modules.
      ci-typecheck-command: 'bunx tsc --noEmit'
      ci-test-command: ':'
      ci-coverage-command: ':'
      enable-gitleaks: false # Preserve the existing Gitleaks setting.

  integration:
    name: Redis and Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install and build
        run: |
          npm install --global bun@1.3.9
          bun install --frozen-lockfile
          bun run build
      - name: Regression checks
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379
        run: |
          for check in scripts/check-*.ts; do bun "$check"; done
          for check in scripts/check-*.mjs; do node "$check"; done
      - name: Docker build and runtime smoke check
        run: sh scripts/check-docker.sh

  build:
    name: Build
    if: always()
    needs: [build-flow, integration]
    runs-on: ubuntu-latest
    steps:
      # Keep the existing Build check name available for branch protection.
      - name: Require successful validation
        env:
          BUILD_FLOW_RESULT: ${{ needs.build-flow.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: test "$BUILD_FLOW_RESULT" = success && test "$INTEGRATION_RESULT" = success
